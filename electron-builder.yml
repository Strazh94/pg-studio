appId: dev.pgstudio.app
productName: PG Studio
directories:
  output: release
files:
  - dist/**/*
  - build/**/*
  - package.json
asar: true
mac:
  category: public.app-category.developer-tools
  identity: null
  target:
    - target: dmg
      arch:
        - x64
        - arm64
dmg:
  title: PG Studio
win:
  target:
    - nsis
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
linux:
  target:
    - AppImage
